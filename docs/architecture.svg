<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="StudyAI architecture">
  <rect width="960" height="540" fill="#0b1220"/>
  <text x="40" y="48" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">StudyAI  Classroom Memory Agent</text>
  <text x="40" y="74" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="13">Discord · AWS Lambda · Amazon Bedrock · CockroachDB VECTOR</text>

  <rect x="40" y="110" width="160" height="70" rx="8" fill="#1f2a44" stroke="#3d4f76"/>
  <text x="120" y="140" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Discord</text>
  <text x="120" y="160" text-anchor="middle" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="11">slash + gateway</text>

  <rect x="260" y="110" width="180" height="70" rx="8" fill="#1f2a44" stroke="#3d4f76"/>
  <text x="350" y="140" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">API Gateway</text>
  <text x="350" y="160" text-anchor="middle" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="11">/ingestion /interactions</text>

  <rect x="500" y="90" width="200" height="110" rx="8" fill="#1f2a44" stroke="#3d4f76"/>
  <text x="600" y="120" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">AWS Lambda</text>
  <text x="600" y="142" text-anchor="middle" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="11">ingest · resolve · gap-report</text>
  <text x="600" y="162" text-anchor="middle" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="11">+ EventBridge cron</text>
  <text x="600" y="182" text-anchor="middle" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="11">agent topic-link loop</text>

  <rect x="760" y="110" width="160" height="70" rx="8" fill="#243015" stroke="#6b8f3a"/>
  <text x="840" y="140" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Bedrock</text>
  <text x="840" y="160" text-anchor="middle" fill="#b7d48a" font-family="Helvetica, Arial, sans-serif" font-size="11">Titan + Claude</text>

  <rect x="260" y="280" width="440" height="140" rx="10" fill="#1a2740" stroke="#4c7cf0"/>
  <text x="480" y="315" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">CockroachDB  Agentic Memory</text>
  <text x="480" y="345" text-anchor="middle" fill="#9db7ff" font-family="Helvetica, Arial, sans-serif" font-size="12">courses · syllabus_topics · questions · answers</text>
  <text x="480" y="368" text-anchor="middle" fill="#9db7ff" font-family="Helvetica, Arial, sans-serif" font-size="12">question_topic_links · agent_actions · topic_coverage</text>
  <text x="480" y="395" text-anchor="middle" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="12">Distributed VECTOR INDEX · MCP verify · Agent Skills design</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b9bb4"/>
    </marker>
  </defs>
  <line x1="200" y1="145" x2="260" y2="145" stroke="#8b9bb4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="145" x2="500" y2="145" stroke="#8b9bb4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="145" x2="760" y2="145" stroke="#8b9bb4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="480" y2="280" stroke="#4c7cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="180" x2="700" y2="300" stroke="#6b8f3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="40" y="500" fill="#8b9bb4" font-family="Helvetica, Arial, sans-serif" font-size="12">Memory write ’ VECTOR link ’ Bedrock act ’ Discord report · System of record: CockroachDB</text>
